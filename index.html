<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO TYLER — Weekly Training Program</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7c5cfc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GO TYLER" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient background blobs -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
            <ellipse cx="20" cy="12" rx="8" ry="12" fill="currentColor" opacity="0.85" transform="rotate(-15 20 12)"/>
            <ellipse cx="44" cy="12" rx="8" ry="12" fill="currentColor" opacity="0.85" transform="rotate(15 44 12)"/>
            <ellipse cx="32" cy="36" rx="22" ry="20" fill="currentColor"/>
            <ellipse cx="24" cy="32" rx="4" ry="4.5" fill="#0a0a0f"/>
            <ellipse cx="40" cy="32" rx="4" ry="4.5" fill="#0a0a0f"/>
            <ellipse cx="32" cy="40" rx="5" ry="3.5" fill="#0a0a0f"/>
            <path d="M29 44 Q32 48 35 44" stroke="#0a0a0f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">GO TYLER</span>
      </div>
      <div class="header-stats">
        <div class="stat">
          <span class="stat-value" id="weekStreak">0</span>
          <span class="stat-label">Week Streak</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="completedCount">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="weekProgress">0%</span>
          <span class="stat-label">This Week</span>
        </div>
      </div>
      <button class="reset-btn" id="resetBtn" title="Reset all progress">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Motivational Banner -->
  <section class="hero">
    <div class="hero-inner">
      <p class="hero-tag">YOUR WEEKLY BLUEPRINT</p>
      <h1 class="hero-title">Train With<br/><span class="gradient-text">Purpose.</span></h1>
      <p class="hero-sub">7 days. 7 missions. No excuses. Every rep brings you closer to the version of yourself you're building.</p>
      <div class="progress-ring-container">
        <svg class="progress-ring" width="120" height="120">
          <circle class="progress-ring-bg" cx="60" cy="60" r="52" />
          <circle class="progress-ring-fill" cx="60" cy="60" r="52" id="progressRing" />
        </svg>
        <div class="progress-ring-text" id="progressRingText">0/7</div>
      </div>
    </div>
  </section>

  <!-- Weekly Grid -->
  <main class="week-grid" id="weekGrid">
    <!-- Days injected by JS -->
  </main>

  <!-- Workout Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="modal-header">
        <span class="modal-day-badge" id="modalDayBadge"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-focus" id="modalFocus"></p>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Exercises injected by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn-complete" id="btnComplete">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Mark as Complete</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Quote Footer -->
  <footer class="footer">
    <p class="quote" id="quote"></p>
    <p class="footer-brand">GO TYLER &mdash; Built for those who show up.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
